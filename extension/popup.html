<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TA Copilot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 20px 24px;
        min-width: 280px;
        background: #0f0f14;
        color: #e4e4e7;
        font-size: 13px;
        line-height: 1.4;
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 24px;
        text-align: center;
        color: #fafafa;
        letter-spacing: -0.02em;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s, background-color 0.2s;
      }
      button.primary {
        background: #7c3aed;
        color: #fff;
      }
      button.primary:hover:not(:disabled) {
        background: #8b5cf6;
      }
      button.secondary {
        background: #27272a;
        color: #e4e4e7;
      }
      button.secondary:hover:not(:disabled) {
        background: #3f3f46;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .status-row {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #27272a;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .polling-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #a1a1aa;
      }
      .polling-indicator[data-active="true"] {
        color: #22c55e;
      }
      .polling-indicator[data-active="false"] {
        visibility: hidden;
        height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .polling-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #22c55e;
        flex-shrink: 0;
      }
      .polling-indicator[data-active="true"] .polling-dot {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      #status {
        font-size: 12px;
        color: #a1a1aa;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>TA Copilot</h1>
    <div class="actions">
      <button id="loginBtn" class="primary">Sign in with Microsoft</button>
      <button id="logoutBtn" class="secondary" disabled>Sign out</button>
    </div>
    <div class="status-row">
      <div id="pollingIndicator" class="polling-indicator" data-active="false">
        <span class="polling-dot"></span>
        <span>Polling</span>
      </div>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
