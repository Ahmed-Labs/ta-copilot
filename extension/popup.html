<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TA Copilot</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        min-width: 260px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      button {
        display: block;
        width: 100%;
        margin: 6px 0;
        padding: 8px 10px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary {
        background: #0078d4;
        color: #fff;
      }
      button.secondary {
        background: #f3f2f1;
        color: #323130;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #444;
      }
      label {
        display: block;
        font-size: 12px;
        margin-top: 10px;
        margin-bottom: 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h1>TA Copilot</h1>
    <button id="loginBtn" class="primary">Sign in with Microsoft</button>
    <button id="logoutBtn" class="secondary" disabled>Sign out</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
